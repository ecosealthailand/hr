<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecoseal Staff Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--Y:#FFC107;--Yd:#e6ac00;--Yl:#fff8e1;--B:#29ABE2;--Bd:#1a8abf;--Bl:#e3f4fc;--T:#0a0a0a;--T2:#1a1a18;--T3:#4a5568;--BOR:#d1d9e0;--BG:#f0f2f5;--W:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:var(--BG);color:var(--T);min-height:100vh}

/* HEADER */
.header{background:var(--Y);padding:0 28px;position:sticky;top:0;z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header-inner{max-width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 4px}
.logo-img{height:46px;object-fit:contain}
.hmeta{font-size:13px;color:#1a1a18;font-weight:700}

/* WRAP — Full HD full width */
.wrap{width:100%;max-width:100%;padding:20px 28px}
@media(min-width:1920px){.wrap{padding:20px 60px}}

/* NAV */
.nav-wrap{background:var(--W);border-radius:14px;border:1px solid var(--BOR);margin-bottom:20px;padding:0 8px;display:flex;overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nb{padding:14px 22px;border:none;background:none;cursor:pointer;font-size:14px;color:#4a5568;border-bottom:3px solid transparent;margin-bottom:-1px;font-family:inherit;white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:7px;transition:all .2s}
.nb.active{color:var(--Bd);border-bottom-color:var(--B)}
.nb:hover:not(.active){color:var(--T)}
.pg{display:none}.pg.active{display:block}

/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:#4a5568;margin-bottom:14px;flex-wrap:wrap}
.breadcrumb a{color:var(--Bd);cursor:pointer;font-weight:700}.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{color:#9aa0ab}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1400px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--W);border-radius:12px;padding:16px 16px 14px;border:1px solid var(--BOR);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.bkpi::after{background:var(--B)}.ykpi::after{background:var(--Y)}.gkpi::after{background:#10b981}.pkpi::after{background:#db2777}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(41,171,226,.18);border-color:var(--B)}
.kpi-lbl{font-size:11px;color:#4a5568;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi-val{font-size:28px;font-weight:800;color:var(--T);line-height:1}
.kpi-sub{font-size:11px;color:#4a5568;margin-top:4px;font-weight:600}
.kpi-hint{font-size:10px;color:var(--Bd);margin-top:5px;font-weight:700}

/* CHARTS */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.cc{background:var(--W);border:1px solid var(--BOR);border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ctitle{font-size:11px;font-weight:700;color:#4a5568;margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.drill-hint{font-size:10px;color:var(--Bd);font-weight:700;text-transform:none;letter-spacing:0;background:var(--Bl);padding:2px 9px;border-radius:99px;cursor:default;border:1px solid rgba(41,171,226,.25)}

/* BAR */
.bar-list{display:flex;flex-direction:column;gap:8px}
.br{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 7px;border-radius:8px;cursor:pointer;transition:background .15s}
.br:hover{background:var(--Bl)}.br:hover .bl{color:var(--Bd);font-weight:800}
.bl{width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--T);font-weight:600;transition:color .15s}
.bt{flex:1;height:9px;background:#e8edf2;border-radius:5px;overflow:hidden}
.bf{height:100%;border-radius:5px}
.bn{width:28px;text-align:right;color:var(--T);font-size:12px;font-weight:800}
.bp{font-size:11px;color:#4a5568;width:32px;text-align:right;font-weight:600}

/* DONUT */
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:4px 0}
.leg{display:flex;flex-direction:column;gap:10px}
.lr{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:5px 10px;border-radius:8px;font-weight:700;color:var(--T);transition:background .15s}
.lr:hover{background:var(--Bl)}.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0}

/* HIST */
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding:0 4px}
.hc{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer}
.hc:hover .hb{opacity:.75}.hb{width:100%;border-radius:5px 5px 0 0;min-height:4px;transition:opacity .2s}
.hl{font-size:10px;color:#4a5568;text-align:center;white-space:nowrap;line-height:1.4;font-weight:600}
.hn{font-size:11px;color:var(--T);font-weight:800}

/* MONTH */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mbox{background:var(--BG);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .15s;border:1.5px solid var(--BOR)}
.mbox:hover{background:var(--Bl);border-color:var(--B)}
.mname{font-size:11px;color:#4a5568;margin-bottom:4px;font-weight:700}
.mval{font-size:20px;font-weight:800;color:var(--T)}.mbar{height:4px;border-radius:2px;background:var(--B);margin-top:6px}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 12px;border:1.5px solid var(--BOR);border-radius:9px;background:var(--W);color:var(--T);font-size:13px;font-family:inherit;outline:none;font-weight:600;transition:border-color .2s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--B)}
.toolbar input{flex:1;min-width:200px}
.vb{padding:8px 13px;border:1.5px solid var(--BOR);border-radius:9px;background:var(--W);color:var(--T);cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;transition:all .15s}
.vb.active{background:var(--Bl);color:var(--Bd);border-color:var(--B)}
.export-btn{padding:8px 14px;border:1.5px solid #16a34a;border-radius:9px;background:#f0fdf4;color:#15803d;cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;display:flex;align-items:center;gap:5px;transition:all .15s}
.export-btn:hover{background:#16a34a;color:#fff}
#rc{font-size:13px;color:var(--T);margin-left:auto;font-weight:700}

/* TABLE — sticky header */
.tw{border:1px solid var(--BOR);border-radius:14px;overflow:auto;background:var(--W);box-shadow:0 1px 4px rgba(0,0,0,.06);max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:10;background:var(--BG)}
thead tr{box-shadow:0 2px 4px rgba(0,0,0,.08)}
th{padding:11px 13px;font-weight:800;font-size:11px;color:var(--T);text-align:left;white-space:nowrap;cursor:pointer;border-bottom:2px solid var(--BOR);user-select:none;letter-spacing:.03em;background:var(--BG)}
th:hover{color:var(--Bd);background:#e3f4fc}.sc{color:var(--Bd)!important}
td{padding:10px 13px;border-bottom:1px solid #eef1f5;color:var(--T);vertical-align:middle;white-space:nowrap;font-weight:600}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--Bl);cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}

/* CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--W);border:1.5px solid var(--BOR);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card:hover{border-color:var(--B);box-shadow:0 4px 16px rgba(41,171,226,.18);transform:translateY(-2px)}
.card-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.card-name{font-size:13px;font-weight:800;color:var(--T);line-height:1.3}
.card-sub{font-size:11px;color:#4a5568;margin-top:2px;font-weight:600}
.card-body{border-top:1px solid #eef1f5;padding-top:9px;display:flex;flex-direction:column;gap:5px}
.crow{display:flex;justify-content:space-between;font-size:12px}
.ck{color:#4a5568;font-weight:600}.cv{color:var(--T);font-weight:700;text-align:right;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* BIRTHDAY */
.ulist{display:flex;flex-direction:column;gap:0}
.month-divider{display:flex;align-items:center;gap:10px;padding:14px 0 8px;margin-top:4px}
.month-divider-label{font-size:12px;font-weight:800;color:var(--Bd);background:var(--Bl);padding:4px 14px;border-radius:99px;white-space:nowrap;border:1.5px solid rgba(41,171,226,.3)}
.month-divider-line{flex:1;height:1.5px;background:var(--BOR)}
.ui{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--BG);border-radius:10px;border:1px solid var(--BOR);cursor:pointer;transition:all .15s;margin-bottom:8px}
.ui:hover{background:var(--Bl);border-color:var(--B)}
.ui.today{background:var(--Yl);border-color:var(--Yd)}
.ui.today .ud{color:var(--Yd)}
.ud{font-weight:800;color:var(--Bd);min-width:90px;font-size:13px}
.un{font-size:13px;font-weight:800;color:var(--T)}.us{font-size:12px;color:#4a5568;margin-top:2px;font-weight:600}

/* DRILL PANEL */
.drill-panel{background:var(--W);border-radius:14px;border:1px solid var(--BOR);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.drill-ph{background:linear-gradient(135deg,var(--B),var(--Bd));padding:16px 22px;display:flex;align-items:center;gap:12px}
.drill-pt{font-size:17px;font-weight:800;color:#fff}
.drill-pc{font-size:13px;color:rgba(255,255,255,.8);margin-left:4px;font-weight:600}
.drill-back{margin-left:auto;padding:7px 16px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:9px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:800;transition:background .15s}
.drill-back:hover{background:rgba(255,255,255,.35)}
.drill-tb{padding:16px}

/* sticky table inside drill */
.drill-tb .tw{max-height:calc(100vh - 300px)}

/* PROFILE MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--W);border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.modal-hdr{background:linear-gradient(135deg,var(--B),var(--Bd));padding:24px;border-radius:20px 20px 0 0;position:relative}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;background:rgba(255,255,255,.2);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.modal-close:hover{background:rgba(255,255,255,.35)}
.modal-av{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;border:3px solid rgba(255,255,255,.4);margin-bottom:12px;background:rgba(255,255,255,.18)}
.modal-name{font-size:20px;font-weight:800;color:#fff}
.modal-nick{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px;font-weight:600}
.modal-pos{font-size:13px;color:rgba(255,255,255,.9);margin-top:7px;font-weight:700}
.modal-body{padding:20px}
.sec-title{font-size:11px;font-weight:800;color:#4a5568;text-transform:uppercase;letter-spacing:.07em;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--BOR)}
.sec-title:first-child{margin-top:0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:var(--BG);border-radius:10px;padding:10px 12px}
.info-lbl{font-size:11px;color:#4a5568;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.info-val{font-size:14px;font-weight:800;color:var(--T)}.info-val.accent{color:var(--Bd)}
.info-item.wide{grid-column:1/-1}

/* BACK TO TOP */
.btt{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:var(--B);color:#fff;border:none;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(41,171,226,.45);display:none;align-items:center;justify-content:center;z-index:400;transition:all .2s;font-weight:800}
.btt:hover{background:var(--Bd);transform:translateY(-3px)}
.btt.show{display:flex}

/* MISC */
.loading{text-align:center;padding:80px;color:#4a5568;font-size:15px;font-weight:700}
.err{background:#fff5f5;color:#7a1a1a;padding:18px;border-radius:10px;font-size:14px;line-height:1.8;border:2px solid #fecaca;margin:20px 0;font-weight:600}
.empty{text-align:center;padding:40px;color:#4a5568;font-size:14px;font-weight:700}

@media(max-width:768px){
  .wrap{padding:12px}.header{padding:0 14px}
  .cgrid{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(4,1fr)}
  .cards-grid{grid-template-columns:1fr 1fr}.hmeta{display:none}.info-grid{grid-template-columns:1fr}
  .tw{max-height:70vh}
}
@media(max-width:480px){.cards-grid{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

const MO=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let rows=[],filtered=[],view='table',_sk=null,_sd=1;

const g=(r,k)=>(r[C[k]]||'').trim();
const isMale=r=>/^นาย$/.test(g(r,'prefix'));
const isFem=r=>/^(นางสาว|นาง)$/.test(g(r,'prefix'));
const genderOf=r=>isMale(r)?'ชาย':isFem(r)?'หญิง':'';
const ini=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2);
const avs=i=>`background:${PALE[i%PALE.length]};color:${PAL[i%PAL.length]}`;
const freq=col=>{const c={};rows.forEach(r=>{const v=(r[col]||'').trim();if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]);};

function pd(v){
  if(!v)return null;v=String(v).trim();
  let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){let y=+m[3];if(y>=2500)y-=543;return new Date(y,+m[2]-1,+m[1]);}
  m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){let y=+m[1];if(y>=2500)y-=543;return new Date(y,+m[2]-1,+m[3]);}
  return null;
}
const yAgo=d=>d&&!isNaN(d)?(new Date()-d)/(365.25*864e5):null;
const dobOf=r=>pd(g(r,'dobiso'))||pd(g(r,'dob'));
const stOf=r=>pd(g(r,'start'));
function tenureStr(r){const t=yAgo(stOf(r));if(t===null||t<0)return'';const y=Math.floor(t),mo=Math.floor((t-y)*12);if(y>0)return mo>0?`${y} ปี ${mo} เดือน`:`${y} ปี`;return mo>0?`${mo} เดือน`:'<1 เดือน';}
function ageStr(r){const a=yAgo(dobOf(r));if(!a||a<0)return'';return `${Math.floor(a)} ปี`;}
function fmtDate(d){if(!d||isNaN(d))return'-';return `${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()+543}`;}

// ── EXPORT EXCEL ─────────────────────────────────────────────
function exportData(data,filename){
  const hdr=['No.','รหัส','คำนำหน้า','ชื่อ-สกุล','ชื่อเล่น','ตำแหน่ง','แผนก','ฝ่าย','สาขา','เพศ','อายุ','อายุงาน','วันเกิด','วันเริ่มงาน','มือถือ','Ext.','อีเมล'];
  const d=(data||filtered).map(r=>[g(r,'no'),g(r,'code'),g(r,'prefix'),g(r,'name'),g(r,'nick'),g(r,'pos'),g(r,'dept'),g(r,'div'),g(r,'branch'),genderOf(r),ageStr(r),tenureStr(r),fmtDate(dobOf(r)),fmtDate(stOf(r)),g(r,'mobile'),g(r,'ext'),g(r,'email')]);
  const csv='\uFEFF'+[hdr,...d].map(row=>row.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=(filename||'Ecoseal_Staff')+`_${new Date().toLocaleDateString('th-TH').replace(/\//g,'-')}.csv`;
  a.click();
}
function exportExcel(){exportData(filtered,'Ecoseal_Staff');}

// ── DASHBOARD ────────────────────────────────────────────────
function buildDash(drillData,drillLabel){
  const data=drillData||rows,isDrill=!!drillData;
  const ages=data.map(r=>yAgo(dobOf(r))).filter(a=>a>10&&a<75);
  const tens=data.map(r=>yAgo(stOf(r))).filter(a=>a>=0&&a<60);
  const avgAge=ages.length?Math.round(ages.reduce((s,v)=>s+v,0)/ages.length):'-';
  const avgTen=tens.length?(tens.reduce((s,v)=>s+v,0)/tens.length).toFixed(1)+' ปี':'--';
  const ndept=new Set(data.map(r=>g(r,'dept')).filter(Boolean)).size;
  const nbr=new Set(data.map(r=>g(r,'branch')).filter(Boolean)).size;
  const nM=data.filter(isMale).length,nF=data.filter(isFem).length;

  if(isDrill){
    document.getElementById('page-dash').innerHTML=`
      <div class="breadcrumb"><a onclick="buildDash()">Dashboard</a><span class="sep">›</span><span>${drillLabel}</span></div>
      <div class="drill-panel">
        <div class="drill-ph">
          <div><div class="drill-pt">${drillLabel}</div><span class="drill-pc">${data.length} คน</span></div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="export-btn" style="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff" onclick="exportData(window._drillData,'${drillLabel.replace(/'/g,"\\'")}')">⬇ Export</button>
            <button class="drill-back" onclick="buildDash()">← กลับ Dashboard</button>
          </div>
        </div>
        <div class="drill-tb">${makeDrillTable(data)}</div>
      </div>`;
    window._drillData=data;
    return;
  }

  let h=`<div class="kpi-row">
    <div class="kpi bkpi"><div class="kpi-lbl">พนักงานทั้งหมด</div><div class="kpi-val">${data.length}</div><div class="kpi-sub">คน</div></div>
    <div class="kpi ykpi" onclick="drillCol('dept','')"><div class="kpi-lbl">แผนก</div><div class="kpi-val">${ndept}</div><div class="kpi-sub">แผนก</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
    <div class="kpi bkpi" onclick="drillCol('branch','')"><div class="kpi-lbl">สาขา</div><div class="kpi-val">${nbr}</div><div class="kpi-sub">สาขา</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
    <div class="kpi gkpi"><div class="kpi-lbl">อายุเฉลี่ย</div><div class="kpi-val">${avgAge}</div><div class="kpi-sub">ปี</div></div>
    <div class="kpi gkpi"><div class="kpi-lbl">อายุงานเฉลี่ย</div><div class="kpi-val">${avgTen}</div><div class="kpi-sub"></div></div>
    <div class="kpi bkpi" onclick="drillGender('ชาย')"><div class="kpi-lbl">เพศชาย</div><div class="kpi-val">${nM}</div><div class="kpi-sub">คน</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
    <div class="kpi pkpi" onclick="drillGender('หญิง')"><div class="kpi-lbl">เพศหญิง</div><div class="kpi-val">${nF}</div><div class="kpi-sub">คน</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
  </div>`;

  h+='<div class="cgrid">';
  h+=barChart('พนักงานตามแผนก',C.dept,data,12,0,true,'dept');
  h+=barChart('พนักงานตามสาขา',C.branch,data,10,2,true,'branch');
  h+=barChart('ตำแหน่งงาน',C.pos,data,10,4,true,'pos');
  h+=barChart('ฝ่าย',C.div,data,8,6,true,'div');
  h+=donutChart([['ชาย',nM,'#29ABE2','#e3f4fc'],['หญิง',nF,'#db2777','#fce7f3']].filter(([,n])=>n>0));
  h+='</div><div class="cgrid">';

  if(ages.length){
    const b=['<25','25-30','31-35','36-40','41-45','46-50','51+'],v=Array(7).fill(0);
    ages.forEach(a=>{if(a<25)v[0]++;else if(a<=30)v[1]++;else if(a<=35)v[2]++;else if(a<=40)v[3]++;else if(a<=45)v[4]++;else if(a<=50)v[5]++;else v[6]++;});
    h+=histChart('การกระจายอายุ',b,v,[{a:0,b:25},{a:25,b:30},{a:30,b:35},{a:35,b:40},{a:40,b:45},{a:45,b:50},{a:50,b:200}],'age');
  }
  if(tens.length){
    const b=['<1 ปี','1-3 ปี','3-5 ปี','5-10 ปี','10-15 ปี','15+ ปี'],v=Array(6).fill(0);
    tens.forEach(a=>{if(a<1)v[0]++;else if(a<=3)v[1]++;else if(a<=5)v[2]++;else if(a<=10)v[3]++;else if(a<=15)v[4]++;else v[5]++;});
    h+=histChart('อายุงาน',b,v,[{a:0,b:1},{a:1,b:3},{a:3,b:5},{a:5,b:10},{a:10,b:15},{a:15,b:200}],'tenure');
  }
  h+='</div>';
  document.getElementById('page-dash').innerHTML=h;
}

function barChart(title,col,data,limit,off,clickable,key){
  const cnt={};data.forEach(r=>{const v=(r[col]||'').trim();if(v)cnt[v]=(cnt[v]||0)+1;});
  const entries=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,limit);
  if(!entries.length)return'';
  const max=entries[0][1]||1,total=data.length;
  const hint=clickable?'<span class="drill-hint">คลิกเพื่อดูรายละเอียด</span>':'';
  const bars=entries.map(([l,n],i)=>{
    const safe=l.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    const oc=clickable?`onclick="drillCol('${key}','${safe}')"`:''
    return`<div class="br" ${oc}><div class="bl" title="${l}">${l}</div>
      <div class="bt"><div class="bf" style="width:${Math.round(n/max*100)}%;background:${PAL[(i+off)%PAL.length]}"></div></div>
      <div class="bn">${n}</div><div class="bp">${Math.round(n/total*100)}%</div></div>`;
  }).join('');
  return`<div class="cc"><div class="ctitle">${title}${hint}</div><div class="bar-list">${bars}</div></div>`;
}

function donutChart(data){
  if(!data.length)return'';
  const total=data.reduce((s,[,n])=>s+n,0)||1;
  const r=42,cx=55,cy=55,ci=2*Math.PI*r;let off=0,ps='';
  data.forEach(([,c,stroke])=>{const d=c/total*ci;ps+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${stroke}" stroke-width="18" stroke-dasharray="${d} ${ci-d}" stroke-dashoffset="${-off*ci}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=c/total;});
  const leg=data.map(([l,c,stroke])=>`
    <div class="lr" onclick="drillGender('${l}')">
      <div class="ld" style="background:${stroke}"></div>${l}
      <span style="color:#4a5568;font-size:12px;margin-left:4px;font-weight:700">${Math.round(c/total*100)}% (${c})</span>
    </div>`).join('');
  return`<div class="cc"><div class="ctitle">สัดส่วนเพศ <span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div>
    <div class="donut-wrap">
      <svg width="110" height="110"><circle cx="55" cy="55" r="42" fill="none" stroke="#e8edf2" stroke-width="18"/>${ps}
        <text x="55" y="59" text-anchor="middle" font-size="15" font-weight="800" fill="#0a0a0a">${total}</text>
      </svg><div class="leg">${leg}</div>
    </div></div>`;
}

function histChart(title,bkts,vals,ranges,type){
  const mx=Math.max(...vals)||1;
  const bars=bkts.map((l,i)=>{
    const fn=type==='age'?`drillAgeRange(${ranges[i].a},${ranges[i].b},'${l}')`:`drillTenureRange(${ranges[i].a},${ranges[i].b},'${l}')`;
    return`<div class="hc" onclick="${fn}">
      <div class="hn">${vals[i]||''}</div>
      <div class="hb" style="height:${Math.round(vals[i]/mx*95)+5}px;background:${PAL[i%PAL.length]}"></div>
      <div class="hl">${l}</div></div>`;
  }).join('');
  return`<div class="cc"><div class="ctitle">${title} <span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="hist">${bars}</div></div>`;
}

// ── DRILL ────────────────────────────────────────────────────
function drillCol(key,val){
  const col=C[key];
  const data=val?rows.filter(r=>(r[col]||'').trim()===val):rows;
  buildDash(data,val||(key==='dept'?'ทุกแผนก':key==='branch'?'ทุกสาขา':key==='pos'?'ทุกตำแหน่ง':'ทุกฝ่าย'));
}
function drillGender(gen){buildDash(rows.filter(r=>gen==='ชาย'?isMale(r):isFem(r)),'เพศ'+gen);}
function drillAgeRange(min,max,label){buildDash(rows.filter(r=>{const a=yAgo(dobOf(r));return a!==null&&a>=min&&a<max;}),'อายุ '+label);}
function drillTenureRange(min,max,label){buildDash(rows.filter(r=>{const t=yAgo(stOf(r));return t!==null&&t>=min&&t<max;}),'อายุงาน '+label);}
function drillBirthMonth(mi){
  buildDash(rows.filter(r=>{const bd=dobOf(r);return bd&&!isNaN(bd)&&bd.getMonth()===mi;}),'เดือนเกิด '+MO[mi]);
  show('dash',document.querySelectorAll('.nb')[0]);
}

function makeDrillTable(data){
  if(!data.length)return'<div class="empty">ไม่พบข้อมูล</div>';
  const dlist=[...new Set(rows.map(r=>g(r,'dept')).filter(Boolean))];
  let h='<div class="tw"><table><thead><tr><th></th><th>รหัส</th><th>ชื่อ-สกุล</th><th>ชื่อเล่น</th><th>ตำแหน่ง</th><th>แผนก</th><th>ฝ่าย</th><th>สาขา</th><th>เพศ</th><th>อายุ</th><th>อายุงาน</th><th>วันเกิด</th><th>วันเริ่มงาน</th><th>มือถือ</th><th>อีเมล</th></tr></thead><tbody>';
  data.forEach((r,ri)=>{
    const nm=g(r,'name'),dept=g(r,'dept');
    const di=dlist.indexOf(dept),ci=di>=0?di:ri%PAL.length;
    const gen=genderOf(r),genC=gen==='ชาย'?'#1a8abf':gen==='หญิง'?'#db2777':'#4a5568';
    const genBg=gen==='ชาย'?'#e3f4fc':gen==='หญิง'?'#fce7f3':'#f0f2f5';
    const code=g(r,'code').replace(/'/g,"\\'");
    h+=`<tr onclick="openProfile(rows.find(x=>(x[C.code]||'').trim()==='${code}'))">
      <td><div class="av" style="width:30px;height:30px;font-size:11px;${avs(ci)}">${ini(nm)}</div></td>
      <td style="color:#1a8abf;font-weight:800">${g(r,'code')}</td>
      <td style="font-weight:800">${nm}</td><td>${g(r,'nick')||''}</td><td>${g(r,'pos')||''}</td>
      <td>${dept?`<span class="badge" style="background:${PALE[ci]};color:${PAL[ci]}">${dept}</span>`:''}</td>
      <td>${g(r,'div')||''}</td><td style="color:#1a8abf;font-weight:700">${g(r,'branch')||''}</td>
      <td>${gen?`<span style="background:${genBg};color:${genC};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800">${gen}</span>`:''}</td>
      <td>${ageStr(r)||''}</td><td style="color:#10b981;font-weight:700">${tenureStr(r)||''}</td>
      <td>${fmtDate(dobOf(r))}</td><td>${fmtDate(stOf(r))}</td>
      <td>${g(r,'mobile')||''}</td><td style="color:#7c3aed">${g(r,'email')||''}</td>
    </tr>`;
  });
  return h+'</tbody></table></div>';
}

// ── DIRECTORY ────────────────────────────────────────────────
function buildDir(){
  const depts=[...new Set(rows.map(r=>g(r,'dept')).filter(Boolean))].sort();
  const brs=[...new Set(rows.map(r=>g(r,'branch')).filter(Boolean))].sort();
  const divs=[...new Set(rows.map(r=>g(r,'div')).filter(Boolean))].sort();
  depts.forEach(v=>document.getElementById('fd').add(new Option(v,v)));
  brs.forEach(v=>document.getElementById('fb').add(new Option(v,v)));
  divs.forEach(v=>document.getElementById('ff').add(new Option(v,v)));
  filtered=[...rows];renderDir();
  ['sch','fd','fb','ff','fg'].forEach(id=>{
    document.getElementById(id).addEventListener(id==='sch'?'input':'change',filt);
  });
}
function filt(){
  const q=(document.getElementById('sch').value||'').toLowerCase();
  const dept=document.getElementById('fd').value;
  const br=document.getElementById('fb').value;
  const div=document.getElementById('ff').value;
  const gen=document.getElementById('fg').value;
  filtered=rows.filter(r=>{
    const mq=!q||Object.values(r).some(v=>(v||'').toLowerCase().includes(q));
    return mq&&(!dept||g(r,'dept')===dept)&&(!br||g(r,'branch')===br)&&(!div||g(r,'div')===div)&&(!gen||(gen==='ชาย'?isMale(r):isFem(r)));
  });
  document.getElementById('rc').textContent=`${filtered.length} / ${rows.length} รายการ`;
  renderDir();
}
function setView(v,btn){view=v;document.querySelectorAll('.vb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderDir();}
function renderDir(){document.getElementById('rc').textContent=`${filtered.length} / ${rows.length} รายการ`;view==='card'?renderCards():renderTable();}

const TCOLS=[
  {k:'no',l:'No.'},{k:'code',l:'รหัส'},{k:'name',l:'ชื่อ-สกุล'},{k:'nick',l:'ชื่อเล่น'},
  {k:'pos',l:'ตำแหน่ง'},{k:'dept',l:'แผนก'},{k:'div',l:'ฝ่าย'},{k:'branch',l:'สาขา'},
  {k:'g_',l:'เพศ'},{k:'a_',l:'อายุ'},{k:'t_',l:'อายุงาน'},
  {k:'d_',l:'วันเกิด'},{k:'s_',l:'วันเริ่มงาน'},
  {k:'mobile',l:'มือถือ'},{k:'ext',l:'Ext.'},{k:'email',l:'อีเมล'},
];
function renderTable(){
  if(!filtered.length){document.getElementById('dc').innerHTML='<div class="empty">ไม่พบข้อมูล</div>';return;}
  const dlist=[...new Set(rows.map(r=>g(r,'dept')).filter(Boolean))];
  let h='<div class="tw"><table><thead><tr><th style="width:36px"></th>';
  TCOLS.forEach(({k,l})=>{const s=_sk===k;h+=`<th onclick="srtK('${k}')" class="${s?'sc':''}">${l}${s?(_sd>0?' ▲':' ▼'):''}`;h+='</th>';});
  h+='</tr></thead><tbody>';
  filtered.forEach((r,ri)=>{
    const nm=g(r,'name'),dept=g(r,'dept');
    const di=dlist.indexOf(dept),ci=di>=0?di:ri%PAL.length;
    const gen=genderOf(r),genC=gen==='ชาย'?'#1a8abf':gen==='หญิง'?'#db2777':'#4a5568';
    const genBg=gen==='ชาย'?'#e3f4fc':gen==='หญิง'?'#fce7f3':'#f0f2f5';
    const code=g(r,'code').replace(/'/g,"\\'");
    h+=`<tr onclick="openProfile(rows.find(x=>(x[C.code]||'').trim()==='${code}'))">
      <td><div class="av" style="width:28px;height:28px;font-size:11px;${avs(ci)}">${ini(nm)}</div></td>`;
    TCOLS.forEach(({k})=>{
      let v='';
      if(k==='g_')v=gen?`<span style="background:${genBg};color:${genC};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800">${gen}</span>`:'';
      else if(k==='a_')v=ageStr(r)||'';
      else if(k==='t_')v=`<span style="color:#10b981;font-weight:700">${tenureStr(r)||''}</span>`;
      else if(k==='d_')v=fmtDate(dobOf(r));
      else if(k==='s_')v=fmtDate(stOf(r));
      else{
        v=g(r,k)||'';
        if(k==='dept'&&v){const ii=Math.max(0,dlist.indexOf(v))%PAL.length;v=`<span class="badge" style="background:${PALE[ii]};color:${PAL[ii]}">${v}</span>`;}
        else if(k==='branch'&&v)v=`<span style="color:#1a8abf;font-weight:700">${v}</span>`;
        else if(k==='code'&&v)v=`<span style="color:#1a8abf;font-weight:800">${v}</span>`;
        else if(k==='email'&&v)v=`<span style="color:#7c3aed">${v}</span>`;
      }
      h+=`<td>${v}</td>`;
    });
    h+='</tr>';
  });
  document.getElementById('dc').innerHTML=h+'</tbody></table></div>';
}
function srtK(k){
  if(_sk===k)_sd*=-1;else{_sk=k;_sd=1;}
  filtered.sort((a,b)=>{
    if(k==='t_')return((yAgo(stOf(a))||0)-(yAgo(stOf(b))||0))*_sd;
    if(k==='a_')return((yAgo(dobOf(a))||0)-(yAgo(dobOf(b))||0))*_sd;
    if(k==='s_'){const da=stOf(a)||new Date(0),db=stOf(b)||new Date(0);return(da-db)*_sd;}
    if(k==='d_'){const da=dobOf(a)||new Date(0),db=dobOf(b)||new Date(0);return(da-db)*_sd;}
    if(k==='g_')return genderOf(a).localeCompare(genderOf(b),'th')*_sd;
    const av=g(a,k)||'',bv=g(b,k)||'';
    const n=Number(av)-Number(bv);return(isNaN(n)?av.localeCompare(bv,'th'):n)*_sd;
  });
  renderTable();
}
function renderCards(){
  if(!filtered.length){document.getElementById('dc').innerHTML='<div class="empty">ไม่พบข้อมูล</div>';return;}
  const dlist=[...new Set(rows.map(r=>g(r,'dept')).filter(Boolean))];
  let h='<div class="cards-grid">';
  filtered.forEach((r,ri)=>{
    const nm=g(r,'name'),nick=g(r,'nick'),dept=g(r,'dept'),br=g(r,'branch'),pos=g(r,'pos');
    const di=dlist.indexOf(dept),ci=di>=0?di:ri%PAL.length;
    const gen=genderOf(r),genC=gen==='ชาย'?'#1a8abf':gen==='หญิง'?'#db2777':'#4a5568';
    const genBg=gen==='ชาย'?'#e3f4fc':gen==='หญิง'?'#fce7f3':'#f0f2f5';
    const code=g(r,'code').replace(/'/g,"\\'");
    h+=`<div class="card" onclick="openProfile(rows.find(x=>(x[C.code]||'').trim()==='${code}'))">
      <div class="card-top"><div class="av" style="width:42px;height:42px;font-size:14px;${avs(ci)}">${ini(nm)}</div>
        <div><div class="card-name">${nm||''}</div><div class="card-sub">${nick?`"${nick}" · `:''}${g(r,'code')||''}</div></div></div>
      <div class="card-body">
        ${dept?`<div class="crow"><span class="ck">แผนก</span><span class="cv"><span class="badge" style="background:${PALE[ci]};color:${PAL[ci]}">${dept}</span></span></div>`:''}
        ${br?`<div class="crow"><span class="ck">สาขา</span><span class="cv" style="color:#1a8abf">${br}</span></div>`:''}
        ${pos?`<div class="crow"><span class="ck">ตำแหน่ง</span><span class="cv">${pos}</span></div>`:''}
        ${gen?`<div class="crow"><span class="ck">เพศ</span><span class="cv"><span style="background:${genBg};color:${genC};padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800">${gen}</span></span></div>`:''}
        ${ageStr(r)?`<div class="crow"><span class="ck">อายุ</span><span class="cv">${ageStr(r)}</span></div>`:''}
        ${tenureStr(r)?`<div class="crow"><span class="ck">อายุงาน</span><span class="cv" style="color:#10b981">${tenureStr(r)}</span></div>`:''}
      </div></div>`;
  });
  document.getElementById('dc').innerHTML=h+'</div>';
}

// ── BIRTHDAY ─────────────────────────────────────────────────
function buildBday(){
  const now=new Date(),mc=Array(12).fill(0),up=[];
  rows.forEach(r=>{
    const bd=dobOf(r);if(!bd||isNaN(bd))return;
    mc[bd.getMonth()]++;
    const ty=new Date(now.getFullYear(),bd.getMonth(),bd.getDate());
    let diff=Math.round((ty-now)/(24*3600*1000));
    if(diff<-1)diff+=365;
    if(diff>=-1&&diff<=90)up.push({r,bd,diff,age:now.getFullYear()-bd.getFullYear()});
  });
  up.sort((a,b)=>a.diff-b.diff);
  const maxM=Math.max(...mc)||1;
  const mg=MO.map((m,i)=>`<div class="mbox" onclick="drillBirthMonth(${i})"><div class="mname">${m}</div><div class="mval">${mc[i]}</div><div class="mbar" style="width:${Math.round(mc[i]/maxM*100)}%"></div></div>`).join('');
  const bmH=MO.map((m,i)=>`<div class="hc" onclick="drillBirthMonth(${i})"><div class="hn">${mc[i]||''}</div><div class="hb" style="height:${Math.round(mc[i]/maxM*95)+5}px;background:${PAL[i%PAL.length]}"></div><div class="hl">${m}</div></div>`).join('');

  // upcoming list with month dividers
  let uhtml='',lastMo=-1;
  if(up.length){
    up.forEach((u,i)=>{
      const mo=u.bd.getMonth();
      if(mo!==lastMo){
        if(lastMo!==-1)uhtml+='</div>';
        const nowMo=now.getMonth(),nowYr=now.getFullYear();
        const dispYr=(mo<nowMo||(mo===nowMo&&u.diff>0))?nowYr+1:nowYr;
        uhtml+=`<div class="month-divider"><span class="month-divider-label">🗓 ${MO[mo]} ${dispYr+543}</span><div class="month-divider-line"></div></div><div>`;
        lastMo=mo;
      }
      const lbl=u.diff===0?'🎂 วันนี้!':u.diff===1?'พรุ่งนี้':`ใน ${u.diff} วัน`;
      const nm=g(u.r,'name'),nick=g(u.r,'nick'),dept=g(u.r,'dept'),br=g(u.r,'branch'),pos=g(u.r,'pos');
      const code=g(u.r,'code').replace(/'/g,"\\'");
      uhtml+=`<div class="ui${u.diff===0?' today':''}" onclick="openProfile(rows.find(x=>(x[C.code]||'').trim()==='${code}'))">
        <div class="ud">${lbl}</div>
        <div class="av" style="width:38px;height:38px;font-size:13px;${avs(i)}">${ini(nm)}</div>
        <div style="flex:1">
          <div class="un">${nm||''}${nick?` <span style="font-weight:600;color:#4a5568">"${nick}"</span>`:''}</div>
          <div class="us">${[dept,br,pos].filter(Boolean).join(' · ')} · ${fmtDate(u.bd)} · อายุ ${u.age} ปี</div>
        </div></div>`;
    });
    if(lastMo!==-1)uhtml+='</div>';
  } else uhtml='<div class="empty">ไม่มีวันเกิดใน 90 วันข้างหน้า</div>';

  // birthday export button
  const bdExportBtn=`<button class="export-btn" onclick="exportData(rows.filter(r=>{const bd=dobOf(r);return bd&&!isNaN(bd)}),'Ecoseal_Birthday')">⬇ Export วันเกิดทั้งหมด</button>`;

  document.getElementById('page-bday').innerHTML=`<div style="display:grid;gap:14px">
    <div style="display:flex;justify-content:flex-end;margin-bottom:-6px">${bdExportBtn}</div>
    <div class="cc"><div class="ctitle">จำนวนพนักงานแต่ละเดือนเกิด <span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="mgrid">${mg}</div></div>
    <div class="cc"><div class="ctitle">กราฟเดือนเกิด <span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="hist">${bmH}</div></div>
    <div class="cc"><div class="ctitle">วันเกิดใน 90 วันข้างหน้า — ${up.length} คน <span style="font-size:11px;color:#4a5568;font-weight:600;text-transform:none">(คลิกเพื่อดูข้อมูล)</span></div><div class="ulist">${uhtml}</div></div>
  </div>`;
}

function show(p,btn){
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');btn.classList.add('active');
  if(p==='bday'&&!document.getElementById('page-bday').innerHTML.trim())buildBday();
}

function initApp(rawText){
  const result=Papa.parse(rawText,{header:true,skipEmptyLines:true});
  if(!result.data||!result.data.length){document.getElementById('loading').innerHTML='<div class="err">⚠️ ไม่พบข้อมูล</div>';return;}
  const sheetCols=result.meta.fields;
  const norm=s=>s.replace(/\s+/g,' ').trim().toLowerCase();
  Object.keys(C).forEach(k=>{const t=norm(C[k]);const f=sheetCols.find(sc=>norm(sc)===t);if(f)C[k]=f;});
  rows=result.data.map(r=>{const o={};sheetCols.forEach(c=>o[c]=(r[c]||'').trim());return o;}).filter(r=>sheetCols.some(c=>r[c]));
  document.getElementById('hm').textContent=`พนักงาน ${rows.length} คน · ${new Date().toLocaleTimeString('th-TH')}`;
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';
  buildDash();buildDir();
}
async function tryLoad(urls,idx){
  if(idx>=urls.length){document.getElementById('loading').innerHTML='<div class="err">❌ โหลดข้อมูลไม่ได้</div>';return;}
  document.getElementById('loading').textContent=`⏳ กำลังโหลด... (${idx+1}/${urls.length})`;
  try{const res=await fetch(urls[idx],{cache:'no-cache'});if(!res.ok)throw new Error('HTTP '+res.status);const text=await res.text();if(text.trim().length<10)throw new Error('empty');initApp(text);}
  catch(e){console.warn('Source',idx,'failed:',e.message);tryLoad(urls,idx+1);}
}
const s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.0/papaparse.min.js';
s.onload=()=>tryLoad([CSV_URL,...PROXIES.map(fn=>fn(CSV_URL))],0);
document.head.appendChild(s);
</script>
