<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecoseal Staff Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--Y:#FFC107;--Yd:#e6ac00;--Yl:#fff8e1;--B:#29ABE2;--Bd:#1a8abf;--Bl:#e3f4fc;--T:#0a0a0a;--T2:#1a1a18;--T3:#4a5568;--BOR:#d1d9e0;--BG:#f0f2f5;--W:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--BG);color:var(--T);min-height:100vh}
.header{background:var(--Y);padding:0 28px;position:sticky;top:0;z-index:300;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.header-inner{max-width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo-img{height:52px;object-fit:contain;max-width:200px}
.hmeta{font-size:13px;color:#1a1a18;font-weight:700}
.wrap{width:100%;padding:20px 28px}
.nav-wrap{background:var(--W);border-radius:14px;border:1px solid var(--BOR);margin-bottom:20px;padding:0 8px;display:flex;overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nb{padding:14px 22px;border:none;background:none;cursor:pointer;font-size:14px;color:#4a5568;border-bottom:3px solid transparent;margin-bottom:-1px;font-family:inherit;white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:7px;transition:all .2s}
.nb.active{color:var(--Bd);border-bottom-color:var(--B)}
.nb:hover:not(.active){color:var(--T)}
.pg{display:none}.pg.active{display:block}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:#4a5568;margin-bottom:14px}
.breadcrumb a{color:var(--Bd);cursor:pointer;font-weight:700}.breadcrumb a:hover{text-decoration:underline}
.kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1400px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--W);border-radius:12px;padding:16px;border:1px solid var(--BOR);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.bkpi::after{background:var(--B)}.ykpi::after{background:var(--Y)}.gkpi::after{background:#10b981}.pkpi::after{background:#db2777}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(41,171,226,.18);border-color:var(--B)}
.kpi-lbl{font-size:11px;color:#4a5568;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi-val{font-size:28px;font-weight:800;color:var(--T);line-height:1}
.kpi-sub{font-size:11px;color:#4a5568;margin-top:4px;font-weight:600}
.kpi-hint{font-size:10px;color:var(--Bd);margin-top:5px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.cc{background:var(--W);border:1px solid var(--BOR);border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ctitle{font-size:11px;font-weight:700;color:#4a5568;margin-bottom:14px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.drill-hint{font-size:10px;color:var(--Bd);font-weight:700;text-transform:none;letter-spacing:0;background:var(--Bl);padding:2px 9px;border-radius:99px;border:1px solid rgba(41,171,226,.25)}
.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:5px 7px;border-radius:8px;cursor:pointer;transition:background .15s}
.bar-row:hover{background:var(--Bl)}.bar-row:hover .bar-lbl{color:var(--Bd);font-weight:800}
.bar-lbl{flex:2;min-width:120px;overflow:visible;white-space:normal;word-break:break-word;color:var(--T);font-weight:600;line-height:1.4;padding-right:4px}
.bar-track{flex:2;height:9px;background:#e8edf2;border-radius:5px;overflow:hidden;margin-top:5px}
.bar-fill{height:100%;border-radius:5px}
.bar-num{width:28px;text-align:right;color:var(--T);font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.bar-pct{font-size:11px;color:#4a5568;width:32px;text-align:right;flex-shrink:0;margin-top:2px;font-weight:600}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:4px 0}
.leg{display:flex;flex-direction:column;gap:10px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:5px 10px;border-radius:8px;font-weight:700;color:var(--T);transition:background .15s}
.leg-row:hover{background:var(--Bl)}.leg-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding:0 4px}
.hist-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer}
.hist-col:hover .hist-bar{opacity:.75}.hist-bar{width:100%;border-radius:5px 5px 0 0;min-height:4px}
.hist-lbl{font-size:10px;color:#4a5568;text-align:center;white-space:nowrap;line-height:1.4;font-weight:600}
.hist-num{font-size:11px;color:var(--T);font-weight:800}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mbox{background:var(--BG);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .15s;border:1.5px solid var(--BOR)}
.mbox:hover{background:var(--Bl);border-color:var(--B)}
.mname{font-size:11px;color:#4a5568;margin-bottom:4px;font-weight:700}.mval{font-size:20px;font-weight:800;color:var(--T)}.mbar{height:4px;border-radius:2px;background:var(--B);margin-top:6px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 12px;border:1.5px solid var(--BOR);border-radius:9px;background:var(--W);color:var(--T);font-size:13px;font-family:inherit;outline:none;font-weight:600}
.toolbar input:focus,.toolbar select:focus{border-color:var(--B)}.toolbar input{flex:1;min-width:200px}
.vbtn{padding:8px 13px;border:1.5px solid var(--BOR);border-radius:9px;background:var(--W);color:var(--T);cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;transition:all .15s}
.vbtn.active{background:var(--Bl);color:var(--Bd);border-color:var(--B)}
.exp-btn{padding:8px 14px;border:1.5px solid #16a34a;border-radius:9px;background:#f0fdf4;color:#15803d;cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;display:flex;align-items:center;gap:5px}
.exp-btn:hover{background:#16a34a;color:#fff}
#rc{font-size:13px;color:var(--T);margin-left:auto;font-weight:700}
.tw{border:1px solid var(--BOR);border-radius:14px;overflow:auto;background:var(--W);box-shadow:0 1px 4px rgba(0,0,0,.06);max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:10}
th{padding:11px 13px;font-weight:800;font-size:11px;color:var(--T);text-align:left;white-space:nowrap;cursor:pointer;border-bottom:2px solid var(--BOR);user-select:none;background:var(--BG)}
th:hover{color:var(--Bd);background:var(--Bl)}.sc{color:var(--Bd)!important}
td{padding:10px 13px;border-bottom:1px solid #eef1f5;color:var(--T);vertical-align:middle;white-space:nowrap;font-weight:600}
tr:last-child td{border-bottom:none}.tr-click:hover td{background:var(--Bl);cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--W);border:1.5px solid var(--BOR);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card:hover{border-color:var(--B);box-shadow:0 4px 16px rgba(41,171,226,.18);transform:translateY(-2px)}
.card-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.card-name{font-size:13px;font-weight:800;color:var(--T);line-height:1.3}.card-sub{font-size:11px;color:#4a5568;margin-top:2px;font-weight:600}
.card-body{border-top:1px solid #eef1f5;padding-top:9px;display:flex;flex-direction:column;gap:5px}
.crow{display:flex;justify-content:space-between;font-size:12px}
.ck{color:#4a5568;font-weight:600}.cv{color:var(--T);font-weight:700;text-align:right;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ulist{display:flex;flex-direction:column;gap:0}
.mo-div{display:flex;align-items:center;gap:10px;padding:14px 0 8px;margin-top:4px}
.mo-lbl{font-size:12px;font-weight:800;color:var(--Bd);background:var(--Bl);padding:4px 14px;border-radius:99px;white-space:nowrap;border:1.5px solid rgba(41,171,226,.3)}
.mo-line{flex:1;height:1.5px;background:var(--BOR)}
.bday-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--BG);border-radius:10px;border:1px solid var(--BOR);cursor:pointer;transition:all .15s;margin-bottom:8px}
.bday-row:hover{background:var(--Bl);border-color:var(--B)}
.bday-row.today{background:var(--Yl);border-color:var(--Yd)}
.bday-lbl{font-weight:800;color:var(--Bd);min-width:90px;font-size:13px}
.bday-row.today .bday-lbl{color:var(--Yd)}
.drill-panel{background:var(--W);border-radius:14px;border:1px solid var(--BOR);overflow:hidden}
.drill-head{background:linear-gradient(135deg,var(--B),var(--Bd));padding:16px 22px;display:flex;align-items:center;gap:12px}
.drill-title{font-size:17px;font-weight:800;color:#fff}
.drill-cnt{font-size:13px;color:rgba(255,255,255,.8);font-weight:600}
.drill-back{margin-left:auto;padding:7px 16px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:9px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:800}
.drill-back:hover{background:rgba(255,255,255,.35)}
.drill-tw{padding:16px}.drill-tw .tw{max-height:calc(100vh - 300px)}
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--W);border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.modal-head{background:linear-gradient(135deg,var(--B),var(--Bd));padding:24px;border-radius:20px 20px 0 0;position:relative}
.modal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;background:rgba(255,255,255,.2);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.modal-x:hover{background:rgba(255,255,255,.35)}
.modal-av{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;border:3px solid rgba(255,255,255,.4);margin-bottom:12px;background:rgba(255,255,255,.18)}
.modal-name{font-size:20px;font-weight:800;color:#fff}.modal-nick{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px;font-weight:600}
.modal-pos{font-size:13px;color:rgba(255,255,255,.9);margin-top:7px;font-weight:700}
.modal-body{padding:20px}
.sec-h{font-size:11px;font-weight:800;color:#4a5568;text-transform:uppercase;letter-spacing:.07em;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--BOR)}
.sec-h:first-child{margin-top:0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:var(--BG);border-radius:10px;padding:10px 12px}.info-item.wide{grid-column:1/-1}
.info-lbl{font-size:11px;color:#4a5568;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.info-val{font-size:14px;font-weight:800;color:var(--T)}.info-val.ac{color:var(--Bd)}
.btt{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:var(--B);color:#fff;border:none;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(41,171,226,.45);display:none;align-items:center;justify-content:center;z-index:400;font-weight:800}
.btt:hover{background:var(--Bd)}.btt.show{display:flex}
.loading-box{text-align:center;padding:80px;color:#4a5568;font-size:15px;font-weight:700}
.err-box{background:#fff5f5;color:#7a1a1a;padding:18px;border-radius:10px;font-size:14px;line-height:1.8;border:2px solid #fecaca;margin:20px 0;font-weight:600}
.empty{text-align:center;padding:40px;color:#4a5568;font-size:14px;font-weight:700}
@media(max-width:768px){.wrap{padding:12px}.header{padding:0 14px}.cgrid{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(4,1fr)}.cards-grid{grid-template-columns:1fr 1fr}.hmeta{display:none}.info-grid{grid-template-columns:1fr}.tw{max-height:70vh}}
@media(max-width:480px){.cards-grid{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<script>
// ── COLUMN MAP ───────────────────────────────────────────────
// Column names from actual sheet (row 2 of CSV)
// Col 0 = No. (empty header), Col 1 = Emp.Code (empty header), Col 2+ = named
const C = {
  no:'', code:'', prefix:'คำนำหน้า\n(ไทย)',
  name:'ชื่อ-สกุล\n(ไทย)', nick:'ชื่อเล่น\n(ไทย)', pos:'ตำแหน่ง\n(ไทย)',
  dept:'แผนก\n(ไทย)', div:'ฝ่าย\n(ไทย)', branch:'สาขา\n(ไทย)',
  tel:'เบอร์โทร', ext:'Ext.', mobile:'Mobile No.', email:'E-mail',
  start:'วันเริ่มงาน\nStart Date', dob:'วันเกิด\nDOB', dobiso:'DOB (ISO)',
};

// ── DATA SOURCE ──────────────────────────────────────────────
const SHEET_ID = '1uAecDWgBjV3fbUiTocuPjW4lCX8N5w82SsuAbHWhV_U';
const URLS = [
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`,
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`,
  `https://api.allorigins.win/raw?url=${encodeURIComponent('https://docs.google.com/spreadsheets/d/e/2PACX-1vT8quBD-tiz47Dyqq9qZLwpwRh2Db0B9n0XJbJQ4sWXvMALL_G3FP78dntvyX7eGI5p3z-dpRoBdQPW/pub?output=csv')}`,
  `https://corsproxy.io/?${encodeURIComponent('https://docs.google.com/spreadsheets/d/e/2PACX-1vT8quBD-tiz47Dyqq9qZLwpwRh2Db0B9n0XJbJQ4sWXvMALL_G3FP78dntvyX7eGI5p3z-dpRoBdQPW/pub?output=csv')}`,
];

const PAL  = ['#29ABE2','#1a8abf','#10b981','#7c3aed','#e11d48','#FFC107','#db2777','#0891b2','#65a30d','#9333ea','#0f766e','#dc2626'];
const PALE = ['#e3f4fc','#b3dff5','#d1fae5','#ede9fe','#fee2e2','#fff8e1','#fce7f3','#cffafe','#ecfccb','#f3e8ff','#ccfbf1','#fecaca'];
const MO   = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let rows = [], filtered = [], currentView = 'table';
let dirSK = null, dirSD = 1;
let drillSK = null, drillSD = 1, drillRows = [];

// ── HELPERS ──────────────────────────────────────────────────
// Column index map — confirmed from actual CSV (col 0-1 have no header name)
const IDX = {
  no:0, code:1, prefix:2, name:3, nick:4,
  pos:5, dept:6, div:7, branch:8,
  tel:9, ext:19, mobile:18, email:20,
  start:21, dob:22, dobiso:23
};

const g = (r,k) => {
  const idx = IDX[k];
  if(idx !== undefined && r._r) return (r._r[idx]||'').trim();
  return '';
};

// เพศจากคำนำหน้า: นาย=ชาย, นาง/นางสาว=หญิง
const isMale = r => /^นาย$/.test(g(r,'prefix'));
const isFem  = r => /^(นางสาว|นาง)$/.test(g(r,'prefix'));
const gOf    = r => isMale(r)?'ชาย':isFem(r)?'หญิง':'';
const ini    = n => (n||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2);
const avCol  = i => `background:${PALE[i%PALE.length]};color:${PAL[i%PAL.length]}`;
const freq   = col => { const c={}; rows.forEach(r=>{ const v=g(r,col); if(v) c[v]=(c[v]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]); };
const deptList = () => [...new Set(rows.map(r=>g(r,'dept')).filter(Boolean))];

function pd(v){
  if(!v) return null; v = String(v).trim();
  let m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){ let y=+m[3]; if(y>=2500)y-=543; return new Date(y,+m[2]-1,+m[1]); }
  m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){ let y=+m[1]; if(y>=2500)y-=543; return new Date(y,+m[2]-1,+m[3]); }
  return null;
}
const yAgo  = d => d&&!isNaN(d) ? (new Date()-d)/(365.25*864e5) : null;
const dobOf = r => pd(g(r,'dobiso')) || pd(g(r,'dob'));
const stOf  = r => pd(g(r,'start'));
function tenureStr(r){ const t=yAgo(stOf(r)); if(t===null||t<0) return ''; const y=Math.floor(t),mo=Math.floor((t-y)*12); if(y>0) return mo>0?`${y} ปี ${mo} เดือน`:`${y} ปี`; return mo>0?`${mo} เดือน`:'<1 เดือน'; }
function ageStr(r){ const a=yAgo(dobOf(r)); if(!a||a<0) return ''; return `${Math.floor(a)} ปี`; }
function fmtDate(d){ if(!d||isNaN(d)) return '-'; return `${d.getDate()} ${MO[d.getMonth()]} ${d.getFullYear()+543}`; }
function genBadge(gen){ const c=gen==='ชาย'?'#1a8abf':gen==='หญิง'?'#db2777':'#4a5568'; const bg=gen==='ชาย'?'#e3f4fc':gen==='หญิง'?'#fce7f3':'#f0f2f5'; return gen?`<span style="background:${bg};color:${c};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800">${gen}</span>`:''; }
function deptBadge(dept){ const dl=deptList(); const ii=Math.max(0,dl.indexOf(dept))%PAL.length; return dept?`<span class="badge" style="background:${PALE[ii]};color:${PAL[ii]}">${dept}</span>`:''; }

// Back to top
window.addEventListener('scroll',()=>{ const b=document.getElementById('bttBtn'); if(b) b.classList.toggle('show',window.scrollY>300); });
function backToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

// ── PROFILE MODAL ────────────────────────────────────────────
function openProfile(code){
  const r = rows.find(x=>g(x,'code')===code);
  if(!r) return;
  const nm=g(r,'name'), nick=g(r,'nick'), dept=g(r,'dept'), br=g(r,'branch');
  const dl=deptList(); const ci=Math.max(0,dl.indexOf(dept))%PAL.length;
  const gen=gOf(r); const genC=gen==='ชาย'?'#1a8abf':gen==='หญิง'?'#db2777':'#4a5568'; const genBg=gen==='ชาย'?'#e3f4fc':gen==='หญิง'?'#fce7f3':'#f0f2f5';
  document.getElementById('modal').innerHTML=`
    <div class="modal-head">
      <button class="modal-x" onclick="closeModal()">✕</button>
      <div class="modal-av" style="${avCol(ci)}">${ini(nm)}</div>

// ── EXPORT ───────────────────────────────────────────────────
function exportData(data, filename){
  const hdr=['No.','รหัส','คำนำหน้า','ชื่อ-สกุล','ชื่อเล่น','ตำแหน่ง','แผนก','ฝ่าย','สาขา','เพศ','อายุ','อายุงาน','วันเกิด','วันเริ่มงาน','มือถือ','Ext.','อีเมล'];
  const body = (data||filtered).map(r=>[g(r,'no'),g(r,'code'),g(r,'prefix'),g(r,'name'),g(r,'nick'),g(r,'pos'),g(r,'dept'),g(r,'div'),g(r,'branch'),gOf(r),ageStr(r),tenureStr(r),fmtDate(dobOf(r)),fmtDate(stOf(r)),g(r,'mobile'),g(r,'ext'),g(r,'email')]);
  const csv = '\uFEFF' + [hdr,...body].map(row=>row.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = (filename||'Ecoseal_Staff') + `_${new Date().toLocaleDateString('th-TH').replace(/\//g,'-')}.csv`;
  a.click();
}

// ── DASHBOARD ────────────────────────────────────────────────
function buildDash(drillData, drillLabel){
  const data = drillData || rows;
  const isDrill = !!drillData;

  if(isDrill){
    drillRows = [...data]; drillSK = null; drillSD = 1;
    document.getElementById('page-dash').innerHTML=`
      <div class="breadcrumb"><a onclick="buildDash()">Dashboard</a> › <span>${drillLabel}</span></div>
      <div class="drill-panel">
        <div class="drill-head">
          <div><div class="drill-title">${drillLabel}</div><span class="drill-cnt">${data.length} คน</span></div>
          <div style="display:flex;gap:8px">
            <button class="exp-btn" style="border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff" onclick="exportData(drillRows,'${drillLabel.replace(/'/g,"\\'")}')">⬇ Export</button>
            <button class="drill-back" onclick="buildDash()">← กลับ Dashboard</button>
          </div>
        </div>
        <div class="drill-tw">${makeDrillTable(drillRows)}</div>
      </div>`;
    return;
  }

  const ages = data.map(r=>yAgo(dobOf(r))).filter(a=>a>10&&a<75);
  const tens = data.map(r=>yAgo(stOf(r))).filter(a=>a>=0&&a<60);
  const avgAge = ages.length ? Math.round(ages.reduce((s,v)=>s+v,0)/ages.length) : '-';
  const avgTen = tens.length ? (tens.reduce((s,v)=>s+v,0)/tens.length).toFixed(1)+' ปี' : '--';
  const ndept = new Set(data.map(r=>g(r,'dept')).filter(Boolean)).size;
  const nbr   = new Set(data.map(r=>g(r,'branch')).filter(Boolean)).size;
  const nM = data.filter(isMale).length, nF = data.filter(isFem).length;

  let h = `<div class="kpi-row">
    <div class="kpi bkpi"><div class="kpi-lbl">พนักงานทั้งหมด</div><div class="kpi-val">${data.length}</div><div class="kpi-sub">คน</div></div>
    <div class="kpi ykpi" onclick="drillByCol('dept','')"><div class="kpi-lbl">แผนก</div><div class="kpi-val">${ndept}</div><div class="kpi-sub">แผนก</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
    <div class="kpi bkpi" onclick="drillByCol('branch','')"><div class="kpi-lbl">สาขา</div><div class="kpi-val">${nbr}</div><div class="kpi-sub">สาขา</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
    <div class="kpi gkpi"><div class="kpi-lbl">อายุเฉลี่ย</div><div class="kpi-val">${avgAge}</div><div class="kpi-sub">ปี</div></div>
    <div class="kpi gkpi"><div class="kpi-lbl">อายุงานเฉลี่ย</div><div class="kpi-val">${avgTen}</div><div class="kpi-sub"></div></div>
    <div class="kpi bkpi" onclick="drillByGender('ชาย')"><div class="kpi-lbl">เพศชาย</div><div class="kpi-val">${nM}</div><div class="kpi-sub">คน</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
    <div class="kpi pkpi" onclick="drillByGender('หญิง')"><div class="kpi-lbl">เพศหญิง</div><div class="kpi-val">${nF}</div><div class="kpi-sub">คน</div><div class="kpi-hint">▼ ดูรายละเอียด</div></div>
  </div>`;

  // Row 1: การกระจายอายุ + อายุงาน (ก่อนแผนก)
  h += '<div class="cgrid">';
  if(ages.length){
    const b=['<25','25-30','31-35','36-40','41-45','46-50','51+'],v=Array(7).fill(0);
    ages.forEach(a=>{if(a<25)v[0]++;else if(a<=30)v[1]++;else if(a<=35)v[2]++;else if(a<=40)v[3]++;else if(a<=45)v[4]++;else if(a<=50)v[5]++;else v[6]++;});
    h += makeHist('การกระจายอายุ', b, v, [{a:0,b:25},{a:25,b:30},{a:30,b:35},{a:35,b:40},{a:40,b:45},{a:45,b:50},{a:50,b:200}], 'age');
  }
  if(tens.length){
    const b=['<1 ปี','1-3 ปี','3-5 ปี','5-10 ปี','10-15 ปี','15+ ปี'],v=Array(6).fill(0);
    tens.forEach(a=>{if(a<1)v[0]++;else if(a<=3)v[1]++;else if(a<=5)v[2]++;else if(a<=10)v[3]++;else if(a<=15)v[4]++;else v[5]++;});
    h += makeHist('อายุงาน', b, v, [{a:0,b:1},{a:1,b:3},{a:3,b:5},{a:5,b:10},{a:10,b:15},{a:15,b:200}], 'tenure');
  }
  h += makeDonut([['ชาย',nM,'#29ABE2','#e3f4fc'],['หญิง',nF,'#db2777','#fce7f3']].filter(([,n])=>n>0));
  h += '</div>';
  // Row 2: แผนก สาขา ตำแหน่ง ฝ่าย
  h += '<div class="cgrid">';
  h += makeBarChart('พนักงานตามแผนก', 'dept', data, 'dept');
  h += makeBarChart('พนักงานตามสาขา', 'branch', data, 'branch');
  h += makeBarChart('ตำแหน่งงาน', 'pos', data, 'pos');
  h += makeBarChart('ฝ่าย', 'div', data, 'div');
  h += '</div>';
  document.getElementById('page-dash').innerHTML = h;
}

function makeBarChart(title, col, data, key){
  const cnt = {}; data.forEach(r=>{ const v=g(r,col); if(v) cnt[v]=(cnt[v]||0)+1; });
  const entries = Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return '';
  const max = entries[0][1]||1, total = data.length;
  const bars = entries.map(([l,n],i)=>{
    const safe = l.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    return `<div class="bar-row" onclick="drillByCol('${key}','${safe}')">
      <div class="bar-lbl" title="${l}">${l}</div>
      <div style="display:flex;align-items:center;gap:6px;flex:2;margin-top:3px">
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%;background:${PAL[i%PAL.length]}"></div></div>
        <div class="bar-num">${n}</div><div class="bar-pct">${Math.round(n/total*100)}%</div>
      </div></div>`;
  }).join('');
  return `<div class="cc"><div class="ctitle">${title}<span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="bar-list">${bars}</div></div>`;
}

function makeDonut(data){
  if(!data.length) return '';
  const total = data.reduce((s,[,n])=>s+n,0)||1;
  const r=42,cx=55,cy=55,ci=2*Math.PI*r; let off=0,ps='';
  data.forEach(([,c,stroke])=>{ const d=c/total*ci; ps+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${stroke}" stroke-width="18" stroke-dasharray="${d} ${ci-d}" stroke-dashoffset="${-off*ci}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=c/total; });
  const leg = data.map(([l,c,stroke])=>`<div class="leg-row" onclick="drillByGender('${l}')"><div class="leg-dot" style="background:${stroke}"></div>${l}<span style="color:#4a5568;font-size:12px;margin-left:4px;font-weight:700">${Math.round(c/total*100)}% (${c})</span></div>`).join('');
  return `<div class="cc"><div class="ctitle">สัดส่วนเพศ<span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div>
    <div class="donut-wrap"><svg width="110" height="110"><circle cx="55" cy="55" r="42" fill="none" stroke="#e8edf2" stroke-width="18"/>${ps}
      <text x="55" y="59" text-anchor="middle" font-size="15" font-weight="800" fill="#0a0a0a">${total}</text></svg>
    <div class="leg">${leg}</div></div></div>`;
}

function makeHist(title, bkts, vals, ranges, type){
  const mx = Math.max(...vals)||1;
  const cols = bkts.map((l,i)=>{
    const fn = type==='age' ? `drillAge(${ranges[i].a},${ranges[i].b},'${l}')` : `drillTenure(${ranges[i].a},${ranges[i].b},'${l}')`;
    return `<div class="hist-col" onclick="${fn}"><div class="hist-num">${vals[i]||''}</div><div class="hist-bar" style="height:${Math.round(vals[i]/mx*95)+5}px;background:${PAL[i%PAL.length]}"></div><div class="hist-lbl">${l}</div></div>`;
  }).join('');
  return `<div class="cc"><div class="ctitle">${title}<span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="hist">${cols}</div></div>`;
}

// ── DRILL FUNCTIONS ──────────────────────────────────────────
function drillByCol(key, val){
  const data = val ? rows.filter(r=>g(r,key)===val) : rows;
  const label = val || (key==='dept'?'ทุกแผนก':key==='branch'?'ทุกสาขา':'ทุกฝ่าย');
  buildDash(data, label);
}
function drillByGender(gen){ buildDash(rows.filter(r=>gen==='ชาย'?isMale(r):isFem(r)), 'เพศ'+gen); }
function drillAge(min,max,lbl){ buildDash(rows.filter(r=>{ const a=yAgo(dobOf(r)); return a!==null&&a>=min&&a<max; }), 'อายุ '+lbl); }
function drillTenure(min,max,lbl){ buildDash(rows.filter(r=>{ const t=yAgo(stOf(r)); return t!==null&&t>=min&&t<max; }), 'อายุงาน '+lbl); }
function drillBirthMonth(mi){ buildDash(rows.filter(r=>{ const bd=dobOf(r); return bd&&!isNaN(bd)&&bd.getMonth()===mi; }), 'เดือนเกิด '+MO[mi]); show('dash',document.querySelectorAll('.nb')[0]); }

const DCOLS = [
  {k:'no',l:'No.'},{k:'code',l:'รหัส'},{k:'name',l:'ชื่อ-สกุล'},{k:'nick',l:'ชื่อเล่น'},
  {k:'pos',l:'ตำแหน่ง'},{k:'dept',l:'แผนก'},{k:'div',l:'ฝ่าย'},{k:'branch',l:'สาขา'},
  {k:'_gen',l:'เพศ'},{k:'_age',l:'อายุ'},{k:'_ten',l:'อายุงาน'},
  {k:'_dob',l:'วันเกิด'},{k:'_sta',l:'วันเริ่มงาน'},{k:'mobile',l:'มือถือ'},{k:'email',l:'อีเมล'},
];

function makeDrillTable(data){
  if(!data.length) return '<div class="empty">ไม่พบข้อมูล</div>';
  let h = '<div class="tw"><table><thead><tr><th></th>';
  DCOLS.forEach(({k,l})=>{
    const s = drillSK===k;
    h += `<th onclick="sortDrill('${k}')" class="${s?'sc':''}">${l}${s?(drillSD>0?' ▲':' ▼'):''}`;
    h += '</th>';
  });
  h += '</tr></thead><tbody>';
  data.forEach((r,ri)=>{
    const code = g(r,'code').replace(/'/g,"\\'");
    const dept = g(r,'dept');
    const dl = deptList(); const ci = Math.max(0,dl.indexOf(dept))%PAL.length;
    h += `<tr class="tr-click" onclick="openProfile('${code}')"><td><div class="av" style="width:30px;height:30px;font-size:11px;${avCol(ci)}">${ini(g(r,'name'))}</div></td>`;
    DCOLS.forEach(({k})=>{
      let v = '';
      if(k==='_gen') v = genBadge(gOf(r));
      else if(k==='_age') v = ageStr(r)||'';
      else if(k==='_ten') v = `<span style="color:#10b981;font-weight:700">${tenureStr(r)||''}</span>`;
      else if(k==='_dob') v = fmtDate(dobOf(r));
      else if(k==='_sta') v = fmtDate(stOf(r));
      else {
        v = g(r,k)||'';
        if(k==='dept'&&v) v = deptBadge(v);
        else if(k==='branch'&&v) v = `<span style="color:#1a8abf;font-weight:700">${v}</span>`;
        else if(k==='code'&&v) v = `<span style="color:#1a8abf;font-weight:800">${v}</span>`;
        else if(k==='email'&&v) v = `<span style="color:#7c3aed">${v}</span>`;
      }
      h += `<td>${v}</td>`;
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

function sortDrill(k){
  if(drillSK===k) drillSD*=-1; else { drillSK=k; drillSD=1; }
  drillRows.sort((a,b)=>{
    if(k==='_ten') return ((yAgo(stOf(a))||0)-(yAgo(stOf(b))||0))*drillSD;
    if(k==='_age') return ((yAgo(dobOf(a))||0)-(yAgo(dobOf(b))||0))*drillSD;
    if(k==='_sta'){ const da=stOf(a)||new Date(0),db=stOf(b)||new Date(0); return (da-db)*drillSD; }
    if(k==='_dob'){ const da=dobOf(a)||new Date(0),db=dobOf(b)||new Date(0); return (da-db)*drillSD; }
    if(k==='_gen') return gOf(a).localeCompare(gOf(b),'th')*drillSD;
    const av=g(a,k)||'', bv=g(b,k)||'';
    const n=Number(av)-Number(bv); return (isNaN(n)?av.localeCompare(bv,'th'):n)*drillSD;
  });
  document.querySelector('.drill-tw').innerHTML = makeDrillTable(drillRows);
}

const TCOLS = [

];

function buildDir(){
  const depts = [...new Set(rows.map(r=>g(r,'dept')).filter(Boolean))].sort();
  const brs   = [...new Set(rows.map(r=>g(r,'branch')).filter(Boolean))].sort();
  const divs  = [...new Set(rows.map(r=>g(r,'div')).filter(Boolean))].sort();
  depts.forEach(v=>document.getElementById('fd').add(new Option(v,v)));
  brs.forEach(v=>document.getElementById('fb').add(new Option(v,v)));
  divs.forEach(v=>document.getElementById('ff').add(new Option(v,v)));
  filtered = [...rows]; renderDir();
  ['sch','fd','fb','ff','fg'].forEach(id=>{ document.getElementById(id).addEventListener(id==='sch'?'input':'change', doFilter); });
}

function doFilter(){
  const q = (document.getElementById('sch').value||'').toLowerCase();
  const dept = document.getElementById('fd').value;
  const br   = document.getElementById('fb').value;
  const div  = document.getElementById('ff').value;
  const gen  = document.getElementById('fg').value;
  filtered = rows.filter(r=>{
    const allVals = r._r ? r._r.join(' ') : '';
    const mq = !q || allVals.toLowerCase().includes(q);
    return mq && (!dept||g(r,'dept')===dept) && (!br||g(r,'branch')===br) && (!div||g(r,'div')===div) && (!gen||(gen==='ชาย'?isMale(r):isFem(r)));
  });
  document.getElementById('rc').textContent = `${filtered.length} / ${rows.length} รายการ`;
  renderDir();
}

  h += '</tr></thead><tbody>';
  filtered.forEach((r,ri)=>{

      else if(k==='_dob') v = fmtDate(dobOf(r));
      else if(k==='_sta') v = fmtDate(stOf(r));

        v = g(r,k)||'';
        if(k==='dept'&&v) v = deptBadge(v);
        else if(k==='branch'&&v) v = `<span style="color:#1a8abf;font-weight:700">${v}</span>`;
        else if(k==='code'&&v) v = `<span style="color:#1a8abf;font-weight:800">${v}</span>`;

function sortDir(k){
  if(dirSK===k) dirSD*=-1; else { dirSK=k; dirSD=1; }
  filtered.sort((a,b)=>{
    if(k==='_ten') return ((yAgo(stOf(a))||0)-(yAgo(stOf(b))||0))*dirSD;
    if(k==='_age') return ((yAgo(dobOf(a))||0)-(yAgo(dobOf(b))||0))*dirSD;
    if(k==='_sta'){ const da=stOf(a)||new Date(0),db=stOf(b)||new Date(0); return (da-db)*dirSD; }
    if(k==='_dob'){ const da=dobOf(a)||new Date(0),db=dobOf(b)||new Date(0); return (da-db)*dirSD; }
    if(k==='_gen') return gOf(a).localeCompare(gOf(b),'th')*dirSD;
    const av=g(a,k)||'', bv=g(b,k)||'';
    const n=Number(av)-Number(bv); return (isNaN(n)?av.localeCompare(bv,'th'):n)*dirSD;
  });
  renderTable();
}

function renderCards(){
  if(!filtered.length){ document.getElementById('dc').innerHTML='<div class="empty">ไม่พบข้อมูล</div>'; return; }
  const dl = deptList();
  let h = '<div class="cards-grid">';
  filtered.forEach((r,ri)=>{
    const nm=g(r,'name'),nick=g(r,'nick'),dept=g(r,'dept'),br=g(r,'branch'),pos=g(r,'pos');
    const ci = Math.max(0,dl.indexOf(dept))%PAL.length;
    const gen=gOf(r); const genC=gen==='ชาย'?'#1a8abf':gen==='หญิง'?'#db2777':'#4a5568'; const genBg=gen==='ชาย'?'#e3f4fc':gen==='หญิง'?'#fce7f3':'#f0f2f5';
    const code = g(r,'code').replace(/'/g,"\\'");
    h += `<div class="card" onclick="openProfile('${code}')">
      <div class="card-top"><div class="av" style="width:42px;height:42px;font-size:14px;${avCol(ci)}">${ini(nm)}</div>
        <div><div class="card-name">${nm||''}</div><div class="card-sub">${nick?`"${nick}" · `:''}${g(r,'code')||''}</div></div></div>
      <div class="card-body">
        ${dept?`<div class="crow"><span class="ck">แผนก</span><span class="cv">${deptBadge(dept)}</span></div>`:''}
        ${br?`<div class="crow"><span class="ck">สาขา</span><span class="cv" style="color:#1a8abf">${br}</span></div>`:''}
        ${pos?`<div class="crow"><span class="ck">ตำแหน่ง</span><span class="cv">${pos}</span></div>`:''}
        ${gen?`<div class="crow"><span class="ck">เพศ</span><span class="cv"><span style="background:${genBg};color:${genC};padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800">${gen}</span></span></div>`:''}
        ${ageStr(r)?`<div class="crow"><span class="ck">อายุ</span><span class="cv">${ageStr(r)}</span></div>`:''}
        ${tenureStr(r)?`<div class="crow"><span class="ck">อายุงาน</span><span class="cv" style="color:#10b981">${tenureStr(r)}</span></div>`:''}
      </div></div>`;
  });
  document.getElementById('dc').innerHTML = h + '</div>';
}

// ── BIRTHDAY ─────────────────────────────────────────────────
function buildBday(){
  const now=new Date(), mc=Array(12).fill(0), up=[];
  rows.forEach(r=>{
    const bd=dobOf(r); if(!bd||isNaN(bd)) return;
    mc[bd.getMonth()]++;
    const ty=new Date(now.getFullYear(),bd.getMonth(),bd.getDate());
    let diff=Math.round((ty-now)/(24*3600*1000));
    if(diff<-1) diff+=365;
    if(diff>=-1&&diff<=90) up.push({r,bd,diff,age:now.getFullYear()-bd.getFullYear()});
  });
  up.sort((a,b)=>a.diff-b.diff);
  const maxM = Math.max(...mc)||1;
  const mg = MO.map((m,i)=>`<div class="mbox" onclick="drillBirthMonth(${i})"><div class="mname">${m}</div><div class="mval">${mc[i]}</div><div class="mbar" style="width:${Math.round(mc[i]/maxM*100)}%"></div></div>`).join('');
  const bmH = MO.map((m,i)=>`<div class="hist-col" onclick="drillBirthMonth(${i})"><div class="hist-num">${mc[i]||''}</div><div class="hist-bar" style="height:${Math.round(mc[i]/maxM*95)+5}px;background:${PAL[i%PAL.length]}"></div><div class="hist-lbl">${m}</div></div>`).join('');

  let uhtml = '', lastMo = -1;
  if(up.length){
    up.forEach((u,i)=>{
      const mo = u.bd.getMonth();
      if(mo !== lastMo){
        if(lastMo !== -1) uhtml += '</div>';
        const yr = (mo < now.getMonth()) ? now.getFullYear()+1 : now.getFullYear();
        uhtml += `<div class="mo-div"><span class="mo-lbl">🗓 ${MO[mo]} ${yr+543}</span><div class="mo-line"></div></div><div>`;
        lastMo = mo;
      }
      const lbl = u.diff===0?'🎂 วันนี้!':u.diff===1?'พรุ่งนี้':`ใน ${u.diff} วัน`;
      const code = g(u.r,'code').replace(/'/g,"\\'");
      const nm=g(u.r,'name'), nick=g(u.r,'nick'), dept=g(u.r,'dept'), br=g(u.r,'branch'), pos=g(u.r,'pos');
      const bdStr = `${u.bd.getDate()} ${MO[u.bd.getMonth()]}`;
      uhtml += `<div class="bday-row${u.diff===0?' today':''}" onclick="openProfile('${code}')">
        <div class="bday-lbl">${lbl}</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px">
          <div style="font-size:14px;font-weight:800;color:#1a8abf;text-align:center">${bdStr}</div>
          <div class="av" style="width:36px;height:36px;font-size:12px;${avCol(i)}">${ini(nm)}</div>
        </div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:800;color:#0a0a0a">${nm||''}${nick?` <span style="font-weight:600;color:#4a5568">"${nick}"</span>`:''}</div>
          <div style="font-size:12px;color:#4a5568;margin-top:2px;font-weight:600">${[dept,br,pos].filter(Boolean).join(' · ')} · อายุ ${u.age} ปี</div>
          <div style="font-size:12px;color:#db2777;font-weight:700;margin-top:3px">สุขสันต์วันเกิด สุขภาพแข็งแรง คิดหวังสิ่งใดให้สมปรารถนา 🎂🌹🥰</div>
        </div></div>`;
    });
    if(lastMo !== -1) uhtml += '</div>';
  } else {
    uhtml = '<div class="empty">ไม่มีวันเกิดใน 90 วันข้างหน้า</div>';
  }

  document.getElementById('page-bday').innerHTML = `<div style="display:grid;gap:14px">
    <div style="display:flex;justify-content:flex-end"><button class="exp-btn" onclick="exportData(rows.filter(r=>{const bd=dobOf(r);return bd&&!isNaN(bd)}),'Ecoseal_Birthday')">⬇ Export วันเกิดทั้งหมด</button></div>
    <div class="cc"><div class="ctitle">จำนวนพนักงานแต่ละเดือนเกิด<span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="mgrid">${mg}</div></div>
    <div class="cc"><div class="ctitle">กราฟเดือนเกิด<span class="drill-hint">คลิกเพื่อดูรายละเอียด</span></div><div class="hist">${bmH}</div></div>
    <div class="cc"><div class="ctitle">วันเกิดใน 90 วันข้างหน้า — ${up.length} คน <span style="font-size:11px;color:#4a5568;font-weight:600;text-transform:none">(คลิกเพื่อดูข้อมูล)</span></div><div class="ulist">${uhtml}</div></div>
  </div>`;
}

// ── NAV ──────────────────────────────────────────────────────
function show(p,btn){
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active'); btn.classList.add('active');
  if(p==='bday' && !document.getElementById('page-bday').innerHTML.trim()) buildBday();
}

// ── INIT & LOAD ──────────────────────────────────────────────
function initApp(rawText){
  // Parse CSV without header — use index-based column access
  // Sheet structure: row 0-1 = metadata, row 2 = headers, row 3+ = data
  const result = Papa.parse(rawText, {header:false, skipEmptyLines:false});
  const allRows = result.data;
  
  // Find data start row (after header row 2)
  // Header row = row with 'ชื่อ' or 'DOB' keywords
  let dataStart = 3; // default: skip 2 metadata + 1 header
  for(let i=0; i<Math.min(8,allRows.length); i++){
    const rowStr = allRows[i].join(',');
    if(rowStr.includes('ชื่อ-สกุล') || rowStr.includes('DOB (ISO)')){
      dataStart = i+1; break;
    }
  }
  
  // Build rows using global IDX constant
  rows = allRows.slice(dataStart)
    .map(r=>({_r:r}))
    .filter(({_r:r})=> r.length>4 && (r[1]||r[3]||'').trim());
  
  document.getElementById('hm').textContent = `พนักงาน ${rows.length} คน · ${new Date().toLocaleTimeString('th-TH')}`;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  buildDash(); buildDir();
}

async function tryLoad(urls, idx){
  if(idx >= urls.length){
    document.getElementById('loading').innerHTML = `<div class="err-box">❌ โหลดข้อมูลไม่ได้ทุก source<br><br>
      <button onclick="tryLoad(URLS,0)" style="padding:8px 16px;background:#29ABE2;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;margin-top:8px">🔄 ลองใหม่</button></div>`;
    return;
  }
  document.getElementById('loading').innerHTML = `<div style="text-align:center;padding:60px"><div style="font-size:40px;margin-bottom:16px">⏳</div><div style="font-size:15px;font-weight:700;color:#4a5568;margin-bottom:6px">กำลังโหลดข้อมูลพนักงาน...</div><div style="font-size:13px;color:#9aa0ab">(${idx+1}/${urls.length})</div></div>`;
  try{
    const ctrl = new AbortController();
    const tid = setTimeout(()=>ctrl.abort(), 8000);
    const res = await fetch(urls[idx], {cache:'no-cache', signal:ctrl.signal});
    clearTimeout(tid);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    if(text.trim().length < 20) throw new Error('empty');
    if(text.trim().startsWith('<!')) throw new Error('got HTML');
    initApp(text);
  } catch(e){
    console.warn(`URL ${idx} failed:`, e.message);
    tryLoad(urls, idx+1);
  }
}

const s = document.createElement('script');
s.src = 'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.0/papaparse.min.js';
s.onload = () => tryLoad(URLS, 0);
s.onerror = () => { document.getElementById('loading').innerHTML = '<div class="err-box">❌ โหลด library ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต</div>'; };
document.head.appendChild(s);
</script>
